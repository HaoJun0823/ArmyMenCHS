; 对象类名（左下角单位信息栏 / 消息系统共用）
; 来源: TextData.cpp:279 obj_names[]，运行时经 ItemName() 返回给显示
;
; ★ 为什么可以用 explicit 布局：
;   这些字符串在内存里**不是连续排布的**（各自独立、且顺序逆序），
;   无法用 packed4 的顺序走槽推算，因此逐条给出显式 RVA。
;
; ★ 为什么安全（曾被误判为"不可翻译"）：
;   obj_names[] 的唯一引用是 TextData.cpp:325 的 return 语句（纯显示）。
;   拼文件路径用的是另一个数组 obj_category_dirs[]（scripts.cpp:5006），
;   其内容形如 BigTree / FallenTree / FootBridge（无空格），
;   与本文件的 "Big Tree" / "Fallen Tree" / "Foot Bridge" 是两套独立字符串。
;   已用 IDA 逐条核对：改本文件不会碰到任何路径用名。
;
; ★ 索引说明：exe 里 obj_names 的指针表是 dword_4BD66C，
;   下标 0 为 null（对应 ITEM_CLASS-1 的偏移），故从 1 开始。

