; 零散提示文字（非数组、无固定归属的独立字符串）
;
; Only you can prevent forest fires.
;   来源: USA.h:340  char* smoky_text = "Only you can prevent forest fires.";
;   触发: aix.cpp:854  单机模式下每分钟有 1/90 概率随机引发森林大火，
;         若火势成功蔓延(spreadCnt != 1)则调用 ReceiveDashMessage(smoky_text, NULL)
;         在左下角信息屏显示一次（每局最多一次，见 flameLastTime = 0x0fffffff）。
;   引用: exe 中该串(VA 0x4BD7E0) 仅被指针 0x4BD618 引用，
;         而该指针仅在 sub_429880 中使用一次 —— 链路干净，无副作用。
;   原文是 Smokey Bear 的消防公益口号（"Only you can prevent wildfires."），
;   此处按原意直译。
;
; 注意：紧邻的 "All rights reserved." / "Copyright 1998 The 3DO Company"
;       属版权声明，不做翻译。

[Explicit]
; RVA = 中文译文   ; 英文原文 cap=槽容量
0x000BD7E0=只有你能防止森林火灾。 ; Only you can prevent forest fires. cap=36
