; 按键设置界面显示名（Keyboard / Joystick Config）
; ---------------------------------------------------------------------------
; ★ 背景（为什么之前没汉化）：
;   这些名字在 exe 里有**两份独立副本**：
;     0xBD9xx 附近  → USA.h 的 *Title_Text（控制说明列，已由 ui_block.ini 处理）
;     0xD07xx 附近  → TKeyDescriptors[].desc（**按键设置界面实际显示用的**）
;   改前者不影响后者，所以按键设置界面一直显示英文。
;
; ★ 安全性（已用源码验证）：
;   desc 字段仅用于显示：
;     Screen.cpp:4506/4591  pDescription = SargeKeyDescs[i].desc;
;     debug.cpp:1600        ...SargeKeyDescs[j].desc...
;   **没有任何 strcmp / 文件路径使用**，因此可以安全翻译。
;
; ★★ 排除项（绝不可译）：
;   0xD0CB0 起的第三组是**注册表配置键名**：
;     Cursor / MouseRight / White / Red / Move / ChgWeapon
;   Commands.cpp:1078-1122 用 strcmp 与它们比较并读写注册表，
;   翻译会导致配置读写失败。
;
; ★ 本块**结构不规整**：项与项之间夹杂指针/数值数据（间隔 0x18 字节），
;   因此不能用 packed4 连续槽扫描，必须按显式 RVA 定位。
;   故使用 [Explicit] 段：每行 = RVA = 译文 ; 英文原文

[Meta]
Encoding=GBK
Layout=explicit
Count=45

; ── 组 A：士兵动作 / 游戏动作（武器与移动）────────────────────────────
[Explicit]
0x000D0714=前进 ; Forward
0x000D072C=左转 ; Left
0x000D0744=右转 ; Right
0x000D075C=后退 ; Back
0x000D0774=左翻滚 ; Roll Left
0x000D078C=右翻滚 ; Roll Right
0x000D07A4=匍匐 ; Dive
0x000D07BC=跪/卧 ; Kneel/Prone
0x000D07D4=减速 ; Slow
0x000D07EC=开火 ; Fire
0x000D0804=炮塔左转 ; Gun Left
0x000D081C=炮塔右转 ; Gun Right
0x000D0834=主武器 ; Main Weapon
0x000D084C=重武器 ; Heavy Weapon
0x000D0864=特殊武器 ; Special Item
0x000D087C=上车 ; Enter Vehicle
0x000D0894=丢弃物品 ; Drop Item

