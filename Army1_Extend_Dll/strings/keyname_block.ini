; ── 组 C：游戏动作（GamePlayKeyDescs[]，0xD0384 起）────────────────────
;    这批之前显示为英文（Follow/Attack/Defend…），同样来自 desc 字段。
;    ★ 注意：紧随其后的 0xD04E0+ 是注册表键名区（White/Red/Move/
;      ChgWeapon/Cursor/MouseRight），**不可翻译**，故到 0xD04D4 为止。
0x000D0384=跟随 ; Follow
0x000D039C=进攻 ; Attack
0x000D03B4=防御 ; Defend
0x000D03CC=立即进攻 ; Attack Now
0x000D03E4=立即防御 ; Defend Now
0x000D03FC=下一部队 ; Next Unit [缩短: 原'下一支部队'11B超容10B]
0x000D0414=空中打击 ; Air Strike
0x000D042C=空降伞兵 ; Air Paratroop
0x000D0444=空中侦察 ; Air Recon
0x000D045C=滚动 ; Scroll
0x000D0474=聊天 ; Chat
0x000D048C=任务目标 ; Objective
0x000D04A4=查看地图 ; View Map
0x000D04BC=切换瞄准镜 ; Change Gunsight
0x000D04D4=鼠标右键 ; Mouse Button 2
