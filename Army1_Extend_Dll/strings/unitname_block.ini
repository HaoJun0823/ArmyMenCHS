; 兵种类型名（左下角单位信息栏显示用）
; 来源: TextData.cpp:153 UnitTypeName[]
;
; ★ 已用 IDA 逐条确认数组与引用（零售 1.2）：
;     sub_446720（UnitTypeName 本体，IDA 未识别成函数）:
;         cmp ecx, 8 / jge loc_44672D
;         mov eax, off_4BD620[ecx*4]   ; 8 个兵种名
;         retn
;       loc_44672D: mov eax, off_4BD640 ; "None"（越界兜底）
;     与源码 if (eUnit < ARMY_LAST_UNIT) ... else UnitNames[ARMY_LAST_UNIT] 完全对应。
;
;     off_4BD620[] 内容与源码 TextData.cpp:155 顺序逐一吻合：
;       Rifle, Grenade, Flamer, Bazooka, (空), Mortar, Miner, Special, None
;     其中索引 4 指向 dword_696EE0（运行期可变），故不翻译该槽。
;
; ★ 与 TrooperNames[] 的区别（切勿混淆）：
;     TrooperNames[]（RifleMen / GrenadeMen / ...，无空格，off_4BD648）
;     在 Unit.cpp:2164 用于拼动画路径 "Alpine/Units/RifleMen/xxx.axs"，
;     **绝对不可翻译**。本文件不含那批名字。
;
; ★ 必须 explicit：这些串在内存里逆序分散存放，无法顺序走槽。

[Explicit]
; RVA = 中文译文   ; 英文原文 cap=槽容量
0x000BD7D4=步枪部队 ; Rifle Unit cap=12
0x000BD7C4=手榴弹部队 ; Grenade Unit cap=16
; 原拟"火焰喷射部队"需 13 字节，超 cap=12，改用 5 字同义
0x000BD7B8=火焰兵部队 ; Flamer Unit cap=12
0x000BD7A8=火箭筒部队 ; Bazooka Unit cap=16
; 索引 4 = dword_696EE0（运行期填充，非静态字符串），跳过
0x000BD79C=迫击炮部队 ; Mortar Unit cap=12
0x000BD790=工兵部队 ; Miner Unit cap=12
0x000BD780=特种部队 ; Special Unit cap=16
0x000BD778=无 ; None cap=8
