; 单位类型名串块（UnitNames）
; 生成: Tools/exe_scan/emit_ini2.py，后经人工修正
;
; ★★ 严重警告（一次崩溃的根因）：
;   本块起始 RVA 0xBD730 之前的 0xBD70C..0xBD72F 属于 **TrooperNames[]**：
;       "NoTrooper","SpecialMen","MinerMen"
;   更早的 0xBD73C 起是 "SweeperMen","BazookaMen","FlameMen","GrenadeMen",
;   "RifleMen" —— 这些也与 TrooperNames[] 交错。
;   TrooperNames[] 被 Unit.cpp:2164 用于拼装动画目录名：
;       sprintf(filename, "%s/%s", TrooperName(eType), troop_anim_names[i]);
;   一旦改成中文，会去加载 "迫击炮兵/xxx.axs" 这种不存在的路径 →
;   单位精灵表为空 → 游戏在 Armymen.exe+0x144B7 处 esi=0 访问 0xC 崩溃。
;   **绝不可翻译 TrooperNames 中的任何字符串。**
;
;   因此本文件只保留 UnitNames[]（仅用于 TRACE/显示，安全）：
;       "Rifle Unit","Grenade Unit","Flamer Unit","Bazooka Unit","",
;       "Mortar Unit","Miner Unit","Special Unit","None"
;   它们位于 0xBD780 (Special Unit) 起。
;
; 编码 UTF-8; DLL 运行时转 GBK 写入

[Meta]
BaseRVA=0x000BD780
Encoding=GBK
Layout=packed4
Count=9

[Entries]
; 序号 = 中文译文    ; 英文原文 cap=槽容量
0=特种部队 ; Special Unit cap=16
1=工兵部队 ; Miner Unit cap=12
2=迫击炮部队 ; Mortar Unit cap=12
3=火箭筒部队 ; Bazooka Unit cap=16
4=喷火部队 ; Flamer Unit cap=12
5=掷弹部队 ; Grenade Unit cap=16
6=步枪部队 ; Rifle Unit cap=12
