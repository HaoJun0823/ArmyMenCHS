; ArmyMenCHS —— 主配置
; 放在 DLL 同目录。翻译内容全部外置，DLL 只做引擎。

[General]
; 游戏主模块（用于 IAT Hook 定位）
Module=Armymen.exe

[Font]
; 是否 Hook 字体创建，强制中文字体
; 游戏源码 Text.cpp:886 硬编码 ANSI_CHARSET，中文会乱码
Enable=1
; 字体名（UTF-8 存储，DLL 内部转 GBK）
FaceName=宋体
; charset: 134=GB2312_CHARSET（简体中文）, 1=DEFAULT_CHARSET, 0=ANSI_CHARSET
CharSet=134

[Strings]
; ★ 总开关。排查崩溃时可置 0 隔离问题：
;   0 = 完全不改游戏内存（只留字体 Hook）
;   1 = 应用字符串补丁
Enable=1
; 翻译数据目录（相对 DLL 所在目录）
Dir=strings
; 要加载的串块文件（逗号分隔）
; ★ 出问题时可逐个注释掉，缩小范围
Files=ui_block.ini,menu_block.ini,button_block.ini,config_block.ini,unit_block.ini,keyname_block.ini
