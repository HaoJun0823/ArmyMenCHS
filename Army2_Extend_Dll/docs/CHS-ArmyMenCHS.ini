; ============================================================================
;  Army Men II / Toys in Space 中文补丁 —— 主配置
;  Army2_Extend_Dll (ASI) 读取本文件。放在 scripts\ 下与 .asi 同级。
;
;  ★ 设计原则：DLL 里不含任何译文，全部外置到本文件与 strings\*.ini。
;     改译文 / 改开关都不需要重新编译 DLL。
; ============================================================================

[General]
; 是否启用（0 = 完全不改动游戏内存，只写日志）
Enable=1


[Target]
; 目标由 DLL 内置档位表自动识别（按 exe 名 + 时间戳 + 函数签名三重校验），
; 不需要在这里写地址。识别失败时 DLL 会 **拒绝安装**（fail-closed），
; 并在日志里说明原因 —— 宁可完全不汉化，也不把 jmp 写到错误的函数上。
;
; 已支持（全部经实测）：
;   Army Men II (Steam 英文版)       armymen2.exe   1999-02-03
;   Toys in Space (Steam 英文版)     armymentis.exe
;   Army Men II (1999 上海育碧中文版) 识别后**主动停用**（它自带中文支持）
;
; 识别与安装结果见 scripts\ArmyMen2CHS.log / ArmyMenTISCHS.log


[Font]
; 中文字库文件名。DLL 会按以下顺序查找：
;   1) scripts\Hzk16          （推荐：跟补丁放一起）
;   2) <游戏目录>\Hzk16        （官方中文版的放法）
;   3) <游戏目录>\..\Hzk16
; 字库格式 "RSE\x1a"，13x13 点阵，26 字节/字形 —— 来自官方中文版。
File=Hzk16

; 字形宽度（点阵）。官方渲染器硬编码 13，改这个值不会改变渲染行为，
; 仅用于日志与自检比对。字库若不是 13x13，DLL 会拒绝加载（避免画出垃圾）。
Width=13
Height=13


[Strings]
; 内存字符串补丁：把游戏 .data 里的英文串换成中文。
; 数据文件（UTF-8）：strings\am2_strings.ini
Enable=1
Files=am2_strings.ini


[Log]
; 详细程度：0=只有关键事件 1=每条写入都记录（默认）2=含统计
Verbose=1
