name: build-release

# ============================================================================
# ArmyMenCHS —— 《玩具兵大战》系列汉化补丁构建 + 自动发 Release
# 架构：ubuntu-latest + msvc-wine (MSVC v141, 32 位 x86)
# ----------------------------------------------------------------------------
# 一个 job 内顺序产出**五个** zip（每个都解压到对应游戏的根目录）：
#
#   代    内容                 附件名
#   1   《玩具兵大战》          ArmyMen-CHS-Patch-<stamp>.zip
#   2   《玩具兵大战 II》       ArmyMen2-CHS-Patch-<stamp>.zip
#   3   《太空玩具》            armymen_TIS.zip
#   4   《世界大战》            armymen_WW.zip
#   5   《空中战术》            armymen_AT.zip
#
# ★ 3/4/5 代的附件名是固定短名（不带时间戳），唯一性由 Release 的 tag 保证。
#
# 触发：
#   push(main/master)  —— 构建 + 上传 zip；随后 publish job 在同一 run
#                         内按日期-时间打 tag 并发 Release。
#   pull_request       —— 构建（门禁，不发布）
#   workflow_dispatch  —— 手动；可勾选跳过 DLL 编译
#
# ★ 判定标准：每一步正常返回 0 即为成功。
#   体积指纹、逐文件载荷条数一类断言已全部移除 —— 它们是
#   「工具链 × 源码」的联合指纹，改一行代码就红，却不指向真正的产物缺陷。
#
# ★★ 为什么是 ubuntu + msvc-wine（与 MajestyIIExtend / SR_GAME_CHINESE 同款）：
#   windows-2022/2025 镜像**不带 v141 (MSVC 14.16)**，在 VS Installer 里加装
#   连续翻车。msvc-wine 用与 VS 安装器同一份官方 manifest 从微软 CDN 拉包，
#   wine 运行真 cl.exe/link.exe，能精确锁定 VC.Tools.14.16。
#
# ★★ 本项目是 **32 位** DLL（游戏 Armymen.exe 是 PE32/i386），与参考项目
#   的 x64 不同，因此有几处 32 位专属处理（下方已标注）：
#     1. vsdownload --architecture **x86 x64**（两者都要）：
#        x86 cl.exe（Hostx64/x86）启动时按 PATH 找 mspdbcore.dll，而该文件
#        只存在于 **Hostx64/x64** 目录。只拉 x86 会让 wine 下的 cl 报
#        "fatal error C1356: unable to find mspdbcore.dll"。
#        此坑在本地用 VS2017 真实 cl 复现过（见 Tools/ci/_local_test_compile.cmd）。
#     2. compile_dll_wine.py 用 bin/x86/cl + bin/x86/link，并把 bin/x64 也
#        加进 PATH（双保险）。
#     3. 产物校验断言 machine == 0x14C (i386)。
#
# ★ 资源侧（AVI/Audio/Maps/Screens/objects.dat）全是纯 Python 处理，
#   Linux 原生运行，不需要 wine。
# ============================================================================

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Archives/**'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Archives/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_dll:
        description: '跳过 DLL 编译（复用已提交产物；CI 上一般不要勾）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建发布包（ubuntu-latest + msvc-wine MSVC v141 x86）
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      MSVC_WINE_PREFIX: ${{ github.workspace }}/.msvc
      MSVC_SDK_DIR: ${{ github.workspace }}/.msvc-sdk
      MSVCWINE_REF: master

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7.0.1

      # ★ 必须完整 checkout msvc-wine：install.sh 要用仓库里的 lowercase /
      #   fixinclude（Linux 大小写敏感必需）、wrappers/、msvctricks.cpp。
      - name: 检出 msvc-wine
        uses: actions/checkout@v7.0.1
        with:
          repository: mstorsjo/msvc-wine
          ref: ${{ env.MSVCWINE_REF }}
          path: .msvc-wine

      - name: 配置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖（Pillow，导出贴图用）
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow

      - name: 安装 wine / msitools 等依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wine64 msitools ca-certificates winbind
          wine --version

      - name: 还原 MSVC 工具链缓存
        uses: actions/cache@v6.1.0
        with:
          path: .msvc
          key: armymenchs-msvcwine-v141-x86-sdk26100-${{ env.MSVCWINE_REF }}-v1

      # ── 下载工具链（缓存未命中时）：两段 vsdownload + 合并 ──────────
      #   段1 VC 14.16：--major 15 是**关键** —— VC.Tools.14.16 (v141) 只
      #     存在于 VS2017 manifest；VS2022+ 清单里 v141 兼容组件 ID 不同，
      #     vsdownload 找不到会**静默回退最新工具集**。
      #     ★ --architecture **x86 x64**：x64 是 mspdbcore.dll 的来源（见文件头）。
      #     --with-sdk=no：SDK 走段 2。
      #   段2 SDK 26100：与 vcxproj 的 WindowsTargetPlatformVersion 一致
      #     （10.0.26100）。VS2017 manifest 里没有 26100，故走 VS2022 channel。
      - name: 下载并装配 MSVC v141 + Win10 SDK 26100（缓存未命中时）
        run: |
          set -euo pipefail
          if [ -x "${MSVC_WINE_PREFIX}/bin/x86/cl" ] && [ -d "${MSVC_WINE_PREFIX}/kits/10/include/10.0.26100.0" ]; then
            echo "工具链缓存命中（VC 14.16 + SDK 26100），跳过下载。"
          else
            echo "==> [1/3] 下载 VC 14.16 (v141, VS2017 channel, x86+x64)"
            python3 .msvc-wine/vsdownload.py \
              --accept-license --major 15 --msvc-version 15.9 \
              --architecture x86 x64 --host-arch x64 \
              --with-sdk=no --with-atl=no --with-asan=no --with-dia=no \
              --with-msbuild=no --with-devcmd=no \
              --dest "${MSVC_WINE_PREFIX}"

            echo "==> [2/3] 下载 Win10 SDK 26100 (VS2022 channel)"
            python3 .msvc-wine/vsdownload.py \
              --accept-license --major 17 \
              --sdk-version 10.0.26100 \
              --with-default=no \
              --architecture x86 --host-arch x64 \
              --dest "${MSVC_SDK_DIR}"

            echo "==> [3/3] 合并 SDK 26100 进 MSVC prefix"
            if [ -d "${MSVC_WINE_PREFIX}/Windows Kits" ]; then
              echo "!! .msvc/Windows Kits 已存在，意外状态" >&2; exit 1
            fi
            mv "${MSVC_SDK_DIR}/Windows Kits" "${MSVC_WINE_PREFIX}/"
          fi
          rm -rf "${MSVC_SDK_DIR}"

      - name: install.sh（生成包装脚本 / 大小写修复）
        run: |
          set -euo pipefail
          sh .msvc-wine/install.sh "${MSVC_WINE_PREFIX}"

      # ── 编译器验证（门禁）────────────────────────────────────────
      #   必须看到 19.16 才放行（防止 vsdownload 静默回退新版工具集）。
      #   同时显式检查 mspdbcore.dll 就位（C1356 根因诊断）。
      - name: 验证编译器为 MSVC v141 x86（诊断 + 门禁）
        run: |
          set -euo pipefail
          export PATH="${MSVC_WINE_PREFIX}/bin/x86:$PATH"
          echo "-- mspdbcore.dll 就位检查（32位 cl 必需）--"
          find "${MSVC_WINE_PREFIX}/vc/tools/msvc" -name mspdbcore.dll 2>/dev/null || true
          echo "-- cl banner --"
          banner="$(cl 2>&1 || true)"
          echo "$banner" | head -2
          if ! echo "$banner" | grep -q "19\.16"; then
            echo "!! cl 不是 MSVC 14.16 (v141)" >&2
            exit 1
          fi
          echo "-- Win SDK 版本（应含 10.0.26100.0）--"
          ls "${MSVC_WINE_PREFIX}/kits/10/include/"
          echo "-- 磁盘余量 --"
          df -h .

      # ── 编译 DLL（32 位）─────────────────────────────────────────
      #   msvc-wine 无 MSBuild，故由 compile_dll_wine.py 把 vcxproj 的
      #   Release|Win32 选项逐项翻译成 cl/link 命令行。
      - name: 编译 Army1_Extend_Dll.dll（32 位）
        if: ${{ github.event.inputs.skip_dll != 'true' }}
        run: |
          set -euo pipefail
          python3 Tools/ci/compile_dll_wine.py --msvc-prefix "${MSVC_WINE_PREFIX}"

      # ── 组装发布包 ────────────────────────────────────────────────
      #   ci_build.py 做三件事：
      #     1) 复制 Army1_NEW_CHS/* （游戏原生目录布局）
      #     2) pack_diff.py 以 Steam 原版 objects.dat 为基底 + Army1_Object_CHS
      #        的差异块覆盖 -> 产出三地形 objects.dat
      #     3) 复制 DLL / ini / strings
      - name: 组装发布包
        run: |
          set -euo pipefail
          python3 Tools/ci/ci_build.py --out build_out --verify

      # ── 打补丁包（make_patch.py）───────────────────────────────
      #   这一步才产出**最终用户拿到手的目录结构**：
      #     包根   dsound.dll / LICENSE / License.txt / 安装说明.txt
      #     scripts\  Army1_Extend_Dll.asi / ArmyMenCHS.ini / strings\
      #     update\   Audio AVI Campaigns Maps Screens Alpine Bayou Desert
      #
      #   ★ 必须在校验之前跑：verify_release.py 校验的是 stage（最终产物），
      #     而非 build_out（中间目录）。dsound.dll 缺失时游戏不会加载
      #     scripts\*.asi，汉化会完全失效且无任何报错 —— 必须在 CI 拦下。
      - name: 打补丁包（含 ASI Loader / LICENSE / 安装说明）
        run: |
          set -euo pipefail
          python3 Tools/ci/make_patch.py --out stage

      # ── 产物校验（只保留与功能直接相关的事实）───────────────────────
      #   · DLL 必须是 32 位 PE (machine 0x14C) + 导出齐全
      #   · 三个 objects.dat 存在且能重新解析
      #   · 包根必备文件齐全
      #   ★ 体积指纹 / 逐文件载荷条数一类断言已全部去掉：
      #     它们是「工具链 × 源码」的联合指纹，改一行代码就红，
      #     却不指向真正的产物缺陷。判定标准改为「每步正常返回 0」。
      - name: 校验产物完整性
        run: |
          set -euo pipefail
          python3 Tools/ci/verify_release.py stage

      - name: 上传发布包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: armymen-chs
          path: stage/*.zip
          if-no-files-found: error
          retention-days: 30

      # ══════════════════════════════════════════════════════════════════
      #  《玩具兵大战 II》汉化补丁
      # ══════════════════════════════════════════════════════════════════
      #  2 代与 1 代共用同一个 Release（附件里两个 zip 并列），
      #  且**构建流程与 1 代同构**（这是刻意的，见 docs/07：
      #    1 代                                   2 代
      #    compile_dll_wine.py  Army1             compile_dll_wine.py --proj Army2_Extend_Dll
      #    ci_build.py      -> build_out          ci_build_am2.py  -> build_out_am2
      #    make_patch.py    -> stage              make_patch_am2.py -> stage_am2
      #    verify_release.py                      verify_release_am2.py
      #  早期 2 代另起了一套 19 步编排（build_all_am2.py）+ 独立 workflow，
      #  与 1 代分叉；现已废弃，改为与 1 代同一套三段式。
      #
      #  ★ 打包**完全使用仓库内资产**，不依赖作者本机的 I:\ 盘：
      #      Army2_NEW_CHS/  权威载荷（336 文件，游戏原生目录布局）
      #      Army2_CHS/      中文母盘（HZK16 字库、资产审计基线）
      #      asi/dsound.dll  UAL，落名为 dinput.dll
      #      cnc-ddraw/      ddraw.dll + ddraw.ini，随包落**包根**
      #                      （2 代同样是 DirectDraw 程序；早先说明书让玩家
      #                       自行去下载，现已改为随包分发，故必须清掉那句）
      #    这一步以前只在本机能跑（默认路径写死 I:\），CI 上必失败。
      #
      #  ★ 需要 ArmyMen2.exe 的校验（hook 签名 / 全局量 / stub 边界 /
      #    代码补丁 / 译文表逐条对照）在 CI 上跑不了 —— exe 不入库。
      #    它们**不被静默跳过**，由 verify_release_am2.py 把 exe 相关项
      #    退化为 WARN 并在结尾显式列出。本地跑 build_local 那一套补足。
      - name: 编译 Army2_Extend_Dll.dll（32 位）
        if: ${{ github.event.inputs.skip_dll != 'true' }}
        run: |
          set -euo pipefail
          python3 Tools/ci/compile_dll_wine.py --msvc-prefix "${MSVC_WINE_PREFIX}" \
            --proj Army2_Extend_Dll

      - name: 校验《玩具兵大战 II》资产树（纯载荷 + 清单一致）
        run: |
          set -euo pipefail
          python3 Tools/ci/verify_assets_am2.py --dir Army2_NEW_CHS

      - name: 组装《玩具兵大战 II》发布包（仓库内资产）
        run: |
          set -euo pipefail
          # ① 载荷 + 运行期文件 -> build_out_am2
          python3 Tools/ci/ci_build_am2.py --out build_out_am2 --verify

          # ② 打补丁包 -> stage_am2（含 ASI Loader / LICENSE / 必读说明）
          python3 Tools/ci/make_patch_am2.py --out stage_am2

          # ③ 独立校验产物
          python3 Tools/ci/verify_release_am2.py stage_am2

          ls -l stage_am2/*.zip

      - name: 上传《玩具兵大战 II》发布包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: armymen2-chs
          path: stage_am2/*.zip
          if-no-files-found: error
          retention-days: 30

      # ══════════════════════════════════════════════════════════════════
      #  《玩具兵大战：太空玩具》（3 代）汉化补丁
      # ══════════════════════════════════════════════════════════════════
      #  与 1/2 代同构的三段式（compile_dll_wine -> ci_build_am3 ->
      #  make_patch_am3 -> verify_release_am3），但有 **三处实质差异**：
      #
      #  ① title.dat / shared.dat 是**回包产物**，不是仓库里的现成文件。
      #     仓库存的是 Army3_Object_CHS 解包后的 raw/*.bin + png/*.png，
      #     构建期由 Tools/am3_dat_pack.py 回包。
      #     ★ 必须用该工具，**不能**用 am3_dat.py pack：后者会丢掉每个
      #       重编码对象尾部的 24 字节（实测 title 少 3048 B、shared 少
      #       384 B），文件变短 -> 其后对象偏移全部前移 -> 目录表失效。
      #
      #  ② 中文控件以**覆盖层**形式提供：
      #     Army3_Object_CHS/title/png_control_chs/ 覆盖到 title/png/ 之上。
      #     这样 png/ 永远是英文基线，"改了哪几张"可 diff、可复现，
      #     不依赖工作区里 png/ 是否被人工改过。
      #
      #  ③ 包根多两个文件：cnc-ddraw 的 ddraw.dll / ddraw.ini
      #     （3 代在 Steam 版上需要它才能正常渲染）。ci_build_am3.py
      #     从仓库 cnc-ddraw/ 取，make_patch_am3.py 落包根。
      #
      #  ④ 中文配音 171 个 wav 来自 Army3_Voice_CHS/audio（qwen3-tts 生成，
      #     非官方母盘），由 ci_build_am3.py 第 5 步拷进 build_out_am3/audio，
      #     随 update\audio\ 覆盖游戏英文原声，并**纳入 MANIFEST** ——
      #     否则这 171 个文件会绕过 verify_release_am3.py 的载荷逐条核对。
      #
      #  ⑤ 包根补齐 LICENSE / License.txt / 必读说明.txt / 两份 AI 辅助文件。
      #     License.txt 必须含 cnc-ddraw(MIT) 与 qwen3-tts(Apache-2.0) 声明。
      #
      #  ★ scripts\ 里**没有** ini：3 代界面文本全在游戏自己的
      #    strings\strings.txt，不需要译文表（2 代有 ArmyMenCHS.ini）。
      - name: 编译 Army3_Extend_Dll.dll（32 位）
        if: ${{ github.event.inputs.skip_dll != 'true' }}
        run: |
          set -euo pipefail
          python3 Tools/ci/compile_dll_wine.py --msvc-prefix "${MSVC_WINE_PREFIX}" \
            --proj Army3_Extend_Dll

      - name: 组装《太空玩具》发布包（含 dat 无损回包 + 中文配音）
        run: |
          set -euo pipefail
          # ① 载荷 + 回包 title.dat/shared.dat + ASI + 字库 + cnc-ddraw
          #    + 中文配音 -> build_out_am3
          python3 Tools/ci/ci_build_am3.py --out build_out_am3 --verify

          # ② 打补丁包 -> stage_am3（scripts\ + update\ + 包根 + 许可 + 说明）
          python3 Tools/ci/make_patch_am3.py --out stage_am3

          # ③ 独立校验产物（结构 / PE 位数 / dat 尾部完整性 / 许可声明）
          python3 Tools/ci/verify_release_am3.py stage_am3

          ls -l stage_am3/*.zip

      - name: 上传《太空玩具》发布包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: armymen3-chs
          path: stage_am3/*.zip
          if-no-files-found: error
          retention-days: 30

      # ══════════════════════════════════════════════════════════════════
      #  《玩具兵大战：世界大战》（4 代）汉化补丁
      # ══════════════════════════════════════════════════════════════════
      #  与 1/2/3 代同构的三段式（compile_dll_wine -> ci_build_am4 ->
      #  make_patch_am4 -> verify_release_am4），实质差异有五处：
      #
      #  ① 权威值全部按 4 代重测（**不能**沿用 3 代）：
      #       title.dat   4298896 / 203  ->  3502576 / 197
      #       shared.dat  2936433 / 1113 ->  2729541 / 969
      #     FILEID 魔数相同（0x81920667 / 0x81920668），故 am3_dat_pack.py
      #     可直接用；但大小与对象数的断言必须改。
      #
      #  ② shared.dat **也有**中文覆盖层（3 代是 None）。
      #     4 代 shared/png_control_chs/ 有 16 张控件。
      #
      #  ③ ASI 导出名是 ArmyMenWW_Install / ArmyMenWW_Uninstall
      #     （3 代是 ArmyMenTIS_*）。复制 3 代工程忘了改导出名，
      #     会让校验器 G 节直接拦下。
      #
      #  ④ strings.txt 出厂 323 行（3 代 320）、bitmaps 65 个（3 代 61）。
      #
      #  ⑤ 中文配音：4 代英文原声 298 个（3 代 239），其中 48 个为无人声
      #     音效（环境/枪械/多人模式音）不配中文，实际中文配音 250 个
      #     （qwen3-tts 生成，已入库 Army4_Voice_CHS/audio/vos）。
      #     ★ CI **不按数量硬校验**：配音条数随音效甄别浮动，且游戏对
      #     缺失配音静默回退英文原声（不报错、不崩）。判据为
      #     「文件名是英文原声子集 + 抽样探针 + 总体积 > 10 MB」，
      #     与 ci_build_am4 / make_patch_am4 / verify_release_am4 同口径。
      #
      #  ★ 仓库里同样不含 amww.exe（版权 + 体积），
      #    需要 exe 的实机验证项在 CI 上跑不了。
      #  ★ Assets 树自检（Tools/verify_army4_assets.py）**不在 CI 里跑**：
      #    它要逐字节比对作者本机的 GOG 安装目录（I:\），CI 上没有该目录。
      #    与 3 代同一口径（verify_army3_assets.py 也不在 CI 里）。
      #    4 代 dat 的权威值不依赖它 —— 那两条来自 Army4_Object_CHS/*/manifest.json
      #    （带 source_sha256，已用原盘反查确认）。
      - name: 编译 Army4_Extend_Dll.dll（32 位）
        if: ${{ github.event.inputs.skip_dll != 'true' }}
        run: |
          set -euo pipefail
          python3 Tools/ci/compile_dll_wine.py --msvc-prefix "${MSVC_WINE_PREFIX}" \
            --proj Army4_Extend_Dll

      - name: 组装《世界大战》发布包（含 dat 无损回包 + 中文配音）
        run: |
          set -euo pipefail
          # ① 载荷 + 回包 title.dat/shared.dat + ASI + 字库 + cnc-ddraw
          #    + 中文配音 -> build_out_am4
          python3 Tools/ci/ci_build_am4.py --out build_out_am4 --verify

          # ② 打补丁包 -> stage_am4（scripts\ + update\ + 包根 + 许可 + 说明）
          python3 Tools/ci/make_patch_am4.py --out stage_am4

          # ③ 独立校验产物（结构 / PE 位数 / dat 尾部完整性 / 许可声明）
          python3 Tools/ci/verify_release_am4.py stage_am4

          ls -l stage_am4/*.zip

      - name: 上传《世界大战》发布包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: armymen4-chs
          path: stage_am4/*.zip
          if-no-files-found: error
          retention-days: 30

      # ══════════════════════════════════════════════════════════════════
      #  《玩具兵大战：空中战术》（5 代）汉化补丁
      # ══════════════════════════════════════════════════════════════════
      #  仍走三段式（compile_dll_wine -> ci_build_am5 -> make_patch_am5），
      #  但**没有 verify_release_am5.py** —— 这一代不做产物断言，
      #  判定标准是「每一步正常返回 0」。
      #
      #  ★ 5 代与 2/3/4 代最大的实质差异：**没有 dat 回包。**
      #     2/3/4 代都要把 title.dat / shared.dat 从解包工作区无损回包，
      #     5 代的贴图与文本直接以散文件形式进 update\，不需要回包。
      #     故 ci_build_am5.py 退化为"整树复制"。
      #
      #  ★ 第二处差异：**载荷落位**。
      #     Army5_NEW_CHS/ 的 audio\ 与 avi\ 落在**包根**，
      #     只有 update\ 里的内容才进 update\。
      #     （已用实机游戏目录逐字节核对：audio 288 / avi 7 / update 678
      #      与 I:\LocalGames\Army Men\amman7 完全一致。）
      #     照抄 4 代"全部塞进 update\"会让片头动画与配乐不生效。
      #
      #  ★ 包根件与 1/2/3/4 代共用：
      #     asi/dsound.dll -> dinput.dll（UAL，本作按名字导入 DirectInputCreateA）
      #     cnc-ddraw/{ddraw.dll,ddraw.ini}（本作是 2000 年的 DirectDraw 程序）
      #     Army2_CHS/Hzk16（本作无官方中文母盘，复用 2 代那份 13x13 宋体点阵）
      #
      #  ★ 附件名是 armymen_AT.zip（用户指定，不带时间戳）。
      #  仓库里不含 amat.exe，需要 exe 的实机验证项在 CI 上跑不了。
      - name: 编译 Army5_Extend_Dll.dll（32 位）
        if: ${{ github.event.inputs.skip_dll != 'true' }}
        run: |
          set -euo pipefail
          python3 Tools/ci/compile_dll_wine.py --msvc-prefix "${MSVC_WINE_PREFIX}" \
            --proj Army5_Extend_Dll

      - name: 组装《空中战术》发布包（整树载荷，无 dat 回包）
        run: |
          set -euo pipefail
          # ① 载荷（audio/ avi/ update/ 整树）+ ASI + 字库 + cnc-ddraw
          #    -> build_out_am5
          python3 Tools/ci/ci_build_am5.py --out build_out_am5

          # ② 打补丁包 -> stage_am5（scripts\ + audio\ + avi\ + update\ +
          #    包根 + 许可 + 说明），产出 armymen_AT.zip
          python3 Tools/ci/make_patch_am5.py --out stage_am5

          ls -l stage_am5/*.zip

      - name: 上传《空中战术》发布包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: armymen5-chs
          path: stage_am5/*.zip
          if-no-files-found: error
          retention-days: 30

      # 文档内链有效性。原在 build-am2.yml 的 gate job 里，
      # 合并进本 workflow 后保留 —— 改了文档文件名没人发现就会留死链。
      - name: 校验文档相对链接
        run: |
          set -euo pipefail
          python3 Tools/ci/verify_doc_links.py

  publish:
    name: 发布 Release（push 主分支自动按日期-时间打 tag）
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出仓库（供 gh 发版确定 git 上下文）
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 下载发布包
        uses: actions/download-artifact@v8.0.2
        with:
          name: armymen-chs
          path: dist

      # ★ 2 代的包下到独立目录，避免与 1 代的 zip 混在同一层
      #   （两者文件名不同，但仍分开更清晰）
      - name: 下载《玩具兵大战 II》发布包
        uses: actions/download-artifact@v8.0.2
        with:
          name: armymen2-chs
          path: dist2

      # ★ 3 代的包同样下到独立目录，避免三个 zip 混在同一层
      - name: 下载《太空玩具》发布包
        uses: actions/download-artifact@v8.0.2
        with:
          name: armymen3-chs
          path: dist3

      # ★ 4 代的包同样下到独立目录，避免四个 zip 混在同一层
      - name: 下载《世界大战》发布包
        uses: actions/download-artifact@v8.0.2
        with:
          name: armymen4-chs
          path: dist4

      # ★ 5 代的包同样下到独立目录
      - name: 下载《空中战术》发布包
        uses: actions/download-artifact@v8.0.2
        with:
          name: armymen5-chs
          path: dist5

      - name: 计算日期-时间 tag
        id: tag
        run: |
          set -euo pipefail
          # stamp：纯 ASCII 时间戳，只用于 tag 之后若重名的后缀与说明文字；
          #   ★ 附件名已不再带时间戳（见下方 ATT 变量）。
          stamp="$(TZ=Asia/Shanghai date +%Y-%m-%d-%H-%M-%S)"
          # tag：面向玩家的 CJK 前缀标签（统一标准 §5 汉化补丁-YYYY-MM-DD-HH-MM-SS）。
          tag="汉化补丁-${stamp}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            tag="${tag}-${GITHUB_RUN_NUMBER}"
          fi
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "将使用 tag: $tag （stamp: $stamp）"

      - name: 生成 Release 说明（提交记录）
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          slug="${{ github.repository }}"
          repo_url="https://github.com/$slug"

          latest="$(gh api "repos/$slug/releases/latest" 2>/dev/null || true)"
          prev_tag="$(printf '%s' "$latest" | jq -r '.tag_name // empty' 2>/dev/null || true)"
          prev_sha="$(printf '%s' "$latest" | jq -r '.commit.sha // empty' 2>/dev/null || true)"
          if [ -z "$prev_sha" ] && [ -n "$prev_tag" ]; then
            prev_sha="$(gh api "repos/$slug/git/refs/tags/$prev_tag" --jq '.object.sha // empty' 2>/dev/null || true)"
            if [ "$(git cat-file -t "$prev_sha" 2>/dev/null || true)" = "tag" ]; then
              prev_sha="$(gh api "repos/$slug/git/refs/tags/$prev_tag" --jq '.object.object.sha // empty' 2>/dev/null || true)"
            fi
          fi
          if [ -n "$prev_sha" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            base="$prev_sha"; base_label="$prev_tag"
          else
            base="$(git rev-list --max-parents=0 HEAD)"; base_label="首个提交"
          fi

          # ★ 必须用 tformat（不是 format）：format 末尾不带换行，read 在 EOF
          #   遇到无换行行时返回非零并丢弃该行，导致「恰好 1 条提交」时显示 0 条。
          : > commits.md
          git log --no-merges --max-count=60 --pretty=tformat:'%H%x09%s' "$base..HEAD" \
            | while IFS=$'\t' read -r h s; do
                if [ -z "$h" ]; then continue; fi
                printf -- '- [`%s`](%s/commit/%s) %s\n' "${h:0:7}" "$repo_url" "$h" "$s" >> commits.md
              done
          n=$(grep -c '^- ' commits.md || true)
          echo "本次提交记录：$n 条（基准 $base_label）"

          cat > release_notes.md <<EOF
          ## 《玩具兵大战》简体中文汉化补丁 · \`$tag\`

          基于 1998 上海育碧简体中文母盘，对 Steam 重制版做**精细化**汉化：
          以 Steam 原版为基底，只替换真正被本地化的内容。

          下载 zip，**把包内全部内容解压到游戏安装目录**即可。
          EOF
          {
            echo
            echo "### 🧾 本次更新（自 \`$base_label\` 起，共 ${n} 条提交）"
            echo
            if [ -s commits.md ]; then cat commits.md; else echo "(本次构建无新增提交)"; fi
            echo
            echo "### 补丁内容"
            echo
            echo "- 视频/音频/文本/贴图：取自中文母盘，未汉化部分保留 Steam 原版"
            echo "- objects.dat：以 Steam 版为基底，仅覆盖被本地化的精灵块（Alpine 41 / Bayou 37 / Desert 37）"
            echo "- exe 内硬编码文本：由 Army1_Extend_Dll.dll 运行时内存补丁（124 条）"
            echo "- **《玩具兵大战 II》**：官方中文母盘差异移植；界面文本由 Army2_Extend_Dll.asi 运行时接管渲染"
            echo "- **《太空玩具》（3 代）**：无官方中文母盘，为从零翻译。界面文本走游戏自己的 strings.txt；"
            echo "  title.dat / shared.dat 由解包工作区**无损回包**（对象头与尾部逐字节保留，产物与原版等长）；"
            echo "  中文字形由 Army3_Extend_Dll.asi 直接喂 Hzk16 点阵，不经过 GDI；"
            echo "  中文配音 171 段由 qwen3-tts 合成（非克隆，音色与语气有已知差距，删除 update/audio 可退回英文原声）"
            echo "- **cnc-ddraw**：2/3/4/5 代均**已整合**（包根 ddraw.dll / ddraw.ini，MIT），无需自行安装或调兼容模式"
            echo "- **《世界大战》（4 代）**：无官方中文母盘，为从零翻译（与 3 代同路线）。界面文本走游戏自己的 strings.txt；"
            echo "  title.dat / shared.dat 由解包工作区**无损回包**（对象头与尾部逐字节保留，产物与原版等长）；"
            echo "  中文字形由 Army4_Extend_Dll.asi 直接喂 Hzk16 点阵，不经过 GDI；"
            echo "  多人联机菜单按钮在内存中恢复（GOG 版默认移除）"
            echo "- **《空中战术》（5 代）**：无官方中文母盘，为从零翻译。界面文本走游戏自己的 update/strings；"
            echo "  本代**没有 dat 回包** —— 贴图与文本以散文件形式直接覆盖；"
            echo "  片头动画与配乐音效随包提供（包根 audio/ 与 avi/），解压后可脱离光盘运行；"
            echo "  中文字形由 Army5_Extend_Dll.asi 直接喂 Hzk16 点阵；"
            echo "  长文本换行由补丁按引擎自身的量具重新分句，插入点永远落在整字边界"
          } >> release_notes.md

          # ── 下载表（附件名是上传时由 curl ?name= 赋的 ASCII 名）─────────────
          #   ★ 3/4/5 代改用固定短名（armymen_TIS / armymen_WW / armymen_AT），
          #     与 build 阶段产物同名；1/2 代保持原有带时间戳的命名。
          {
            echo
            echo "### 📦 下载"
            echo
            echo "| 附件名 | 内容 |"
            echo "|---|---|"
            echo "| \`ArmyMen-CHS-Patch-${{ steps.tag.outputs.stamp }}.zip\` | 《玩具兵大战》简体中文汉化补丁（解压到游戏根目录） |"
            echo "| \`ArmyMen2-CHS-Patch-${{ steps.tag.outputs.stamp }}.zip\` | 《玩具兵大战 II》简体中文汉化补丁（解压到游戏根目录） |"
            echo "| \`armymen_TIS.zip\` | 《玩具兵大战：太空玩具》简体中文汉化补丁（解压到游戏根目录） |"
            echo "| \`armymen_WW.zip\` | 《玩具兵大战：世界大战》简体中文汉化补丁（解压到游戏根目录） |"
            echo "| \`armymen_AT.zip\` | 《玩具兵大战：空中战术》简体中文汉化补丁（解压到游戏根目录） |"
            echo
            echo "### 📖 必读说明（安装 / 卸载 / 已知问题）"
            echo
            echo "> 每代补丁的 zip **包根都带 必读说明.txt**（解压后在游戏目录里）。"
            echo "> 下面是从五个 zip 内**原样取出**的全文，与玩家拿到手的逐字一致。"
            echo "> 安装方式五代相同：把包内全部内容解压到游戏安装目录"
            echo "> （Armymen.exe / ArmyMen2.exe / ARMYMENTIS.exe / amww.exe / amat.exe 所在处）。"
            echo "> 2/3/4/5 代的包根都新增了 cnc-ddraw 的 \`ddraw.dll\` / \`ddraw.ini\`，"
            echo "> 请勿单独删除；3/5 代需以**管理员模式**运行（详见包内说明）。"
          } >> release_notes.md

          {
            echo
            # ★ 说明在 zip 内部（artifact 只上传 zip，不含独立的说明文件），
            #   故从 zip 里取 —— 保证 Release 正文与玩家实际拿到的包内说明
            #   逐字一致。四代各取一份，合并进同一个 details。
            #   unzip 对中文条目名在部分 locale 下会匹配失败，故用 Python
            #   读 zip（与 build 阶段同一套 zip 解析，不引额外依赖）。
          python3 - <<'PY' > readme_embed.txt
          import glob, io, sys, zipfile

          # ★ 显式把 stdout 钉成 UTF-8：说明正文里有 BOM 字符与中文，
          #   任何非 UTF-8 的默认输出编码（Windows GBK、C locale）都会让
          #   这个 step 直接 UnicodeEncodeError 挂掉。
          #   publish job **没有** build job 那份 PYTHONIOENCODING 环境变量，
          #   故不能指望外部设置。
          sys.stdout.reconfigure(encoding="utf-8")

          # (zip glob, 包根说明文件名, 标题)
          JOBS = [
              ("dist", "必读说明.txt", "《玩具兵大战》(1 代)"),
              ("dist2", "必读说明.txt", "《玩具兵大战 II》(2 代)"),
              ("dist3", "必读说明.txt", "《玩具兵大战：太空玩具》(3 代)"),
              ("dist4", "必读说明.txt", "《玩具兵大战：世界大战》(4 代)"),
              ("dist5", "必读说明.txt", "《玩具兵大战：空中战术》(5 代)"),
          ]
          out = io.StringIO()
          got = 0
          for d, name, title in JOBS:
              zs = sorted(glob.glob("%s/*.zip" % d))
              if not zs:
                  out.write("!! %s 下没有 zip\n" % d)
                  continue
              with zipfile.ZipFile(zs[0]) as z:
                  try:
                      raw = z.read(name)
                  except KeyError:
                      out.write("!! %s 内没有 %s（%s）\n" % (zs[0], name, title))
                      continue
              txt = raw.decode("utf-8-sig", errors="replace").replace("\r\n", "\n")
              out.write("\n" + "=" * 70 + "\n== %s\n" % title + "=" * 70 + "\n\n")
              out.write(txt.strip() + "\n")
              got += 1
          if got == 0:
              raise SystemExit("!! 五个 zip 里一个 必读说明.txt 都没取到")
          print(out.getvalue(), end="")
          PY
            # ★ 断言五份都取到了：少一份就说明某个包没带说明（或改了文件名），
            #   那种情况必须在发版前拦下 —— 玩家拿到没有说明的包等于没头绪。
            n_doc="$(grep -c '^== 《玩具兵大战' readme_embed.txt || true)"
            if [ "$n_doc" -lt 5 ]; then
              echo "!! 只取到 $n_doc 份必读说明（期望 5）" >&2
              sed -n '1,40p' readme_embed.txt >&2
              exit 1
            fi
            if [ -s readme_embed.txt ]; then
              echo "<details><summary>展开五代完整必读说明（与包内 必读说明.txt 逐字一致）</summary>"
              echo
              echo "<pre>"
              cat readme_embed.txt
              echo "</pre>"
              echo
              echo "</details>"
            else
              echo "> ⚠️ 未能从 zip 内取出 必读说明.txt，本次未附带。"
            fi
            echo
            echo "---"
            echo
            echo "源码仓库：<https://github.com/HaoJun0823/ArmyMenCHS>　·　作者主页：<https://www.haojun0823.xyz/>"
          } >> release_notes.md

          sed -i "s/\$tag/$tag/g" release_notes.md
          # 三段结构自检（下载表 / 必读说明 / 提交记录）
          for sec in "### 📦 下载" "### 📖 必读说明" "### 🧾 本次更新"; do
            if ! grep -qF "$sec" release_notes.md; then
              echo "!! release_notes.md 缺少段落「$sec」" >&2; exit 1
            fi
          done
          echo "-- release_notes.md --"
          head -5 release_notes.md

      - name: 创建 Release 并上传 zip
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          stamp="${{ steps.tag.outputs.stamp }}"
          slug="${{ github.repository }}"
          if [ ! -f release_notes.md ]; then echo "!! 未找到 release_notes.md" >&2; exit 1; fi

          REL_JSON=$(gh api -X POST "repos/$slug/releases" \
            -f "tag_name=$tag" -f "name=$tag" \
            -F "body=@release_notes.md" -F "draft=false")
          if [ "$(jq -r .body <<<"$REL_JSON")" = "@release_notes.md" ]; then
            REL_JSON=$(gh api -X POST "repos/$slug/releases" \
              -f "tag_name=$tag" -f "name=$tag" \
              -f "body=$(cat release_notes.md)" -F "draft=false")
          fi
          UPLOAD_URL=$(echo "$REL_JSON" | jq -r .upload_url)
          BASE="${UPLOAD_URL%%\{*}"

          # ── 上传 1 代 ──────────────────────────────────────────────────
          src="$(ls dist/*.zip | head -1)"
          ascii="ArmyMen-CHS-Patch-${stamp}.zip"
          echo "上传 $ascii"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            -H "Accept: application/vnd.github+json" \
            --data-binary "@$src" \
            "${BASE}?name=${ascii}" | jq -r '.name'

          # ── 上传 2 代 ──────────────────────────────────────────────────
          #   文件名保持 build 阶段产出的原名（含 ArmyMen2- 前缀与时间戳），
          #   但时间戳改用发版 stamp，和 1 代附件对得上。
          src2="$(ls dist2/*.zip | head -1)"
          ascii2="ArmyMen2-CHS-Patch-${stamp}.zip"
          echo "上传 $ascii2"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            -H "Accept: application/vnd.github+json" \
            --data-binary "@$src2" \
            "${BASE}?name=${ascii2}" | jq -r '.name'

          # ── 上传 3 代（太空玩具）───────────────────────────────────────
          #   ★ 附件名固定为 armymen_TIS.zip（与 build 产物同名，不带时间戳）。
          src3="$(ls dist3/*.zip | head -1)"
          ascii3="armymen_TIS.zip"
          echo "上传 $ascii3"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            -H "Accept: application/vnd.github+json" \
            --data-binary "@$src3" \
            "${BASE}?name=${ascii3}" | jq -r '.name'

          # ── 上传 4 代（世界大战）───────────────────────────────────────
          #   ★ 附件名固定为 armymen_WW.zip
          src4="$(ls dist4/*.zip | head -1)"
          ascii4="armymen_WW.zip"
          echo "上传 $ascii4"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            -H "Accept: application/vnd.github+json" \
            --data-binary "@$src4" \
            "${BASE}?name=${ascii4}" | jq -r '.name'

          # ── 上传 5 代（空中战术）───────────────────────────────────────
          #   ★ 附件名固定为 armymen_AT.zip
          src5="$(ls dist5/*.zip | head -1)"
          ascii5="armymen_AT.zip"
          echo "上传 $ascii5"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            -H "Accept: application/vnd.github+json" \
            --data-binary "@$src5" \
            "${BASE}?name=${ascii5}" | jq -r '.name'

          # 断言五个附件都在（防"只传了一部分却报成功"）
          names="$(gh api "repos/$slug/releases/tags/$tag" --jq '.assets[].name')"
          for want in "$ascii" "$ascii2" "$ascii3" "$ascii4" "$ascii5"; do
            echo "$names" | grep -qxF "$want" \
              || { echo "!! Release 缺少附件 $want（实有：$names）" >&2; exit 1; }
          done
          echo "✓ 五个附件均已上传"

          # body 自检：非空、非占位符、首行符合预期
          body="$(gh api "repos/$slug/releases/tags/$tag" --jq .body)"
          body_head="${body%%$'\n'*}"
          if [ -z "$body_head" ] || [[ "$body_head" != "## 《玩具兵大战》简体中文汉化补丁"* ]]; then
            echo "!! Release body 异常（首行=[$body_head]）" >&2; exit 1
          fi
          echo "✓ Release body 已写入（首行：${body_head}…）"
          echo "已发布 Release: $tag"
